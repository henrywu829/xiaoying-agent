[project]
name = "kbqa-agent"
version = "0.1.0"
description = "T3 企业知识问答 Agent（Evidence-First QA）"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
